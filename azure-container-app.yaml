apiVersion: apps/v1
kind: Deployment
metadata:
  name: nepse-mcp-server
  labels:
    app: nepse-mcp-server
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nepse-mcp-server
  template:
    metadata:
      labels:
        app: nepse-mcp-server
    spec:
      containers:
        - name: nepse-mcp-server
          image: your-registry.azurecr.io/nepse-mcp-server:latest
          ports:
            - containerPort: 8000
          env:
            - name: PORT
              value: "8000"
            - name: HOST
              value: "0.0.0.0"
            - name: LOG_LEVEL
              value: "INFO"
            - name: ADMIN_API_KEY
              valueFrom:
                secretKeyRef:
                  name: nepse-secrets
                  key: admin-api-key
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: nepse-secrets
                  key: database-url
            - name: SQL_DEBUG
              value: "false"
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: nepse-mcp-service
spec:
  selector:
    app: nepse-mcp-server
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
  type: LoadBalancer
---
apiVersion: v1
kind: Secret
metadata:
  name: nepse-secrets
type: Opaque
data:
  admin-api-key: # Base64 encoded admin API key - replace with your key
  database-url: # Base64 encoded PostgreSQL connection string
  redis-url: # Base64 encoded Redis connection string
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: nepse-mcp-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: nepse-mcp-server
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
